<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Viz-layer order of operations</title><desc id="d">Five ordered steps: dimension filters, then context, then aggregation, then aggregate filters, then table calculations. Context is highlighted because it is the step that determines the denominator for percent-of-total, top-N and ratio metrics.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="800" height="620" fill="#ffffff"/><text x="400.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">The viz layer has its own order of operations</text><text x="400.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">Where a filter lands in this sequence changes the answer</text><rect x="70" y="92" width="660" height="86" rx="10" fill="#f1f5f9" stroke="#1f4e79" stroke-width="1.5"/><rect x="88" y="114" width="42" height="42" rx="21" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.5"/><text x="109" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text><text x="150" y="126" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a">Dimension filters</text><text x="150" y="148" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">Narrow which rows are considered at all.</text><text x="150" y="167" text-anchor="start" font-size="12" font-weight="500" fill="#64748b">Stage = Closed, Region = West</text><line x1="400" y1="178" x2="400" y2="192" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="192" width="660" height="86" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/><rect x="88" y="214" width="42" height="42" rx="21" fill="#059669" stroke="#059669" stroke-width="1.5"/><text x="109" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text><text x="150" y="226" text-anchor="start" font-size="16" font-weight="700" fill="#059669">Context</text><text x="150" y="248" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">The fixed frame everything downstream respects.</text><text x="150" y="267" text-anchor="start" font-size="12" font-weight="500" fill="#64748b">This is the step that sets your denominator</text><line x1="400" y1="278" x2="400" y2="292" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="292" width="660" height="86" rx="10" fill="#f1f5f9" stroke="#1f4e79" stroke-width="1.5"/><rect x="88" y="314" width="42" height="42" rx="21" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.5"/><text x="109" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text><text x="150" y="326" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a">Aggregation</text><text x="150" y="348" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">Rows roll up to the level of detail of the view.</text><text x="150" y="367" text-anchor="start" font-size="12" font-weight="500" fill="#64748b">per account, per month</text><line x1="400" y1="378" x2="400" y2="392" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="392" width="660" height="86" rx="10" fill="#f1f5f9" stroke="#1f4e79" stroke-width="1.5"/><rect x="88" y="414" width="42" height="42" rx="21" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.5"/><text x="109" y="442" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text><text x="150" y="426" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a">Aggregate filters</text><text x="150" y="448" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">Applied after the roll-up.</text><text x="150" y="467" text-anchor="start" font-size="12" font-weight="500" fill="#64748b">SUM(Amount) &gt; 100k — unknowable before summing</text><line x1="400" y1="478" x2="400" y2="492" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="492" width="660" height="86" rx="10" fill="#f1f5f9" stroke="#1f4e79" stroke-width="1.5"/><rect x="88" y="514" width="42" height="42" rx="21" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.5"/><text x="109" y="542" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text><text x="150" y="526" text-anchor="start" font-size="16" font-weight="700" fill="#0f172a">Table calculations</text><text x="150" y="548" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">Run last, on the already-aggregated result.</text><text x="150" y="567" text-anchor="start" font-size="12" font-weight="500" fill="#64748b">running total, percent of total, rank</text><text x="400.0" y="604" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Percent-of-total, top-N and every ratio metric take their denominator from step 2.</text></svg>
