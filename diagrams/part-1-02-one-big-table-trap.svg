<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">The one big table trap</title><desc id="d">A wide flat table with five similarly named amount columns. An agent asked for open pipeline has no structural cue about which column is the real measure, so it guesses. The fix is a modeled fact plus labeled fields.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="820" height="470" fill="#ffffff"/><text x="410.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Why one big table confuses the agent</text><text x="410.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">Five amount-like columns, no structure, and nothing to say which is the real measure</text><rect x="90" y="108" width="620" height="30" rx="0" fill="#1f4e79" stroke="#94a3b8" stroke-width="1"/><text x="152.0" y="127.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Amount</text><text x="276.0" y="127.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Expected Rev</text><text x="400.0" y="127.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ACV</text><text x="524.0" y="127.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">TCV</text><text x="648.0" y="127.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Weighted Amt</text><rect x="90" y="138" width="620" height="30" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="152.0" y="157.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">100,000</text><text x="276.0" y="157.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">65,000</text><text x="400.0" y="157.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">80,000</text><text x="524.0" y="157.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">240,000</text><text x="648.0" y="157.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">65,000</text><rect x="90" y="168" width="620" height="30" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="152.0" y="187.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">75,000</text><text x="276.0" y="187.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">56,250</text><text x="400.0" y="187.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">60,000</text><text x="524.0" y="187.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">180,000</text><text x="648.0" y="187.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">56,250</text><rect x="90" y="198" width="620" height="30" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="152.0" y="217.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">75,000</text><text x="276.0" y="217.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">18,750</text><text x="400.0" y="217.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">75,000</text><text x="524.0" y="217.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">225,000</text><text x="648.0" y="217.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">18,750</text><rect x="90" y="238" width="620" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="400" y="267" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">Agent: “what is my open pipeline?” — which column did you mean?</text><text x="400" y="322" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">To a person, context disambiguates these.</text><text x="400" y="344" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">To an agent reading bare column names, they are interchangeable — so it guesses.</text><rect x="150" y="370" width="500" height="62" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/><text x="400" y="394" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">The fix is not to hide the ambiguity in a wider table.</text><text x="400" y="416" text-anchor="middle" font-size="13" font-weight="400" fill="#047857">Model the fact separately, then label every field (Part 7).</text></svg>
