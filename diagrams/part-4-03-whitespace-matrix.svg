<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">The whitespace matrix</title><desc id="d">A two by two matrix of accounts by whether they have orders and whether they have open opportunities. The four cells are customers with pipeline, customers who bought but have nothing open, net-new logos, and prospects with no facts at all. The bought-but-nothing-open cell is three hundred thousand dollars of business at risk.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="820" height="560" fill="#ffffff"/><text x="410.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Whitespace is a set difference between two conformed facts</text><text x="410.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">Questions a single flat table cannot express, because it has no notion of “in one but not the other”</text><text x="365.0" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">Has open opportunities</text><text x="645.0" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">No open opportunities</text><text x="150" y="205.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">Has orders</text><text x="150" y="375.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">No orders</text><rect x="230" y="130" width="270" height="150" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/><text x="365.0" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#059669">Customer with pipeline</text><text x="365.0" y="196" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Acme Corp, Borealis Ltd</text><text x="365.0" y="220" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">$175,000 open · $300,000 booked</text><text x="365.0" y="244" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Grow and protect</text><rect x="510" y="130" width="270" height="150" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="645.0" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Bought, nothing open</text><text x="645.0" y="196" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Delta, Everest, Fjord, Granite</text><text x="645.0" y="220" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">$300,000 booked · $0 open</text><text x="645.0" y="244" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Re-engagement list</text><rect x="230" y="300" width="270" height="150" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="2"/><text x="365.0" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4e79">Net-new logo</text><text x="365.0" y="366" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Cyan Systems</text><text x="365.0" y="390" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">$75,000 open · $0 booked</text><text x="365.0" y="414" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Treat unlike an expansion</text><rect x="510" y="300" width="270" height="150" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="645.0" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">No relationship yet</text><text x="645.0" y="366" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Helios, Ionic, Juniper</text><text x="645.0" y="390" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">$0 open · $0 booked</text><text x="645.0" y="414" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Prospects, not whitespace</text><rect x="510" y="130" width="270" height="150" rx="10" fill="none" stroke="#b45309" stroke-width="3.5"/><text x="410.0" y="490" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">The upper-right cell is the one leadership asks for: customers who bought before</text><text x="410.0" y="514" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">and have nothing in the pipeline right now. It is $300,000 of business at risk,</text><text x="410.0" y="538" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">and it exists only because the two facts stayed separate.</text></svg>
