<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Drill-across with a full outer join</title><desc id="d">Each fact is aggregated separately at its own grain, then the two summaries are combined with a full outer join on the conformed Account key. The full outer join is what preserves accounts present in only one fact, which are exactly the whitespace rows.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="900" height="580" fill="#ffffff"/><text x="450.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Drill-across: aggregate first, then align on the conformed key</text><text x="450.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">Each fact is summarized at its own grain before the two results meet</text><text x="170" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">Step 1 — aggregate Opportunities</text><rect x="30" y="112" width="280" height="28" rx="0" fill="#1f4e79" stroke="#94a3b8" stroke-width="1"/><text x="105.0" y="130.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Account</text><text x="245.0" y="130.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Open pipeline</text><rect x="30" y="140" width="280" height="28" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="105.0" y="158.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Acme Corp</text><text x="245.0" y="158.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$100,000</text><rect x="30" y="168" width="280" height="28" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="105.0" y="186.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Borealis Ltd</text><text x="245.0" y="186.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$75,000</text><rect x="30" y="196" width="280" height="28" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="105.0" y="214.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Cyan Systems</text><text x="245.0" y="214.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$75,000</text><text x="730" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">Step 1 — aggregate Orders</text><rect x="590" y="112" width="280" height="28" rx="0" fill="#1f4e79" stroke="#94a3b8" stroke-width="1"/><text x="665.0" y="130.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Account</text><text x="805.0" y="130.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Bookings</text><rect x="590" y="140" width="280" height="28" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="665.0" y="158.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Acme Corp</text><text x="805.0" y="158.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$200,000</text><rect x="590" y="168" width="280" height="28" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="665.0" y="186.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Borealis Ltd</text><text x="805.0" y="186.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$100,000</text><rect x="590" y="196" width="280" height="28" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="665.0" y="214.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Granite Bank</text><text x="805.0" y="214.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$55,000</text><rect x="330" y="150" width="240" height="56" rx="10" fill="#059669" stroke="#059669" stroke-width="1.5"/><text x="450" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Step 2</text><text x="450" y="194" text-anchor="middle" font-size="12" font-weight="600" fill="#dcfce7">FULL OUTER JOIN on Account</text><line x1="310" y1="180" x2="326" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><line x1="590" y1="180" x2="574" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="258" width="640" height="30" rx="0" fill="#1f4e79" stroke="#94a3b8" stroke-width="1"/><text x="205.0" y="277.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Account</text><text x="350.0" y="277.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Open pipeline</text><text x="485.0" y="277.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Bookings</text><text x="660.0" y="277.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Reads as</text><rect x="130" y="288" width="640" height="30" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="205.0" y="307.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Acme Corp</text><text x="350.0" y="307.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$100,000</text><text x="485.0" y="307.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$200,000</text><text x="660.0" y="307.32" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">customer with pipeline</text><rect x="130" y="318" width="640" height="30" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="205.0" y="337.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Borealis Ltd</text><text x="350.0" y="337.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$75,000</text><text x="485.0" y="337.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$100,000</text><text x="660.0" y="337.32" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">customer with pipeline</text><rect x="130" y="348" width="640" height="30" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="205.0" y="367.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Cyan Systems</text><text x="350.0" y="367.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$75,000</text><text x="485.0" y="367.32" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">—</text><text x="660.0" y="367.32" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">net-new logo</text><rect x="130" y="378" width="640" height="30" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="205.0" y="397.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Granite Bank</text><text x="350.0" y="397.32" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">—</text><text x="485.0" y="397.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$55,000</text><text x="660.0" y="397.32" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">nothing in pipeline</text><rect x="130" y="420" width="640" height="74" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/><text x="450" y="446" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">The join type is the whole point.</text><text x="450" y="470" text-anchor="middle" font-size="13" font-weight="400" fill="#047857">An inner join would drop the last two rows — and those are the interesting ones.</text><text x="450.0" y="528" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Because each fact was aggregated before the join, there is no Cartesian blow-up:</text><text x="450.0" y="552" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">bookings still total $600,000 and open pipeline still totals $250,000.</text></svg>
