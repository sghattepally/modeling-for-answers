<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Role-playing dimensions</title><desc id="d">A single conformed Date table related three times - as Created Date and Close Date on Opportunity, and as Order Date on Order. Each relationship is a distinct role, so a question must state which date it means.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="820" height="500" fill="#ffffff"/><text x="410.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Role-playing dimensions: one Date table, three meanings</text><text x="410.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">“This quarter” is ambiguous until you say which date you mean</text><rect x="40" y="100" width="180" height="82" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="130.0" y="129.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Created Date</text><text x="130.0" y="147.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">when it entered pipeline</text><text x="130.0" y="165.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">on Opportunity</text><line x1="130" y1="182" x2="410" y2="244" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="100" width="180" height="82" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="410.0" y="129.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Close Date</text><text x="410.0" y="147.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">when it books</text><text x="410.0" y="165.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">on Opportunity</text><line x1="410" y1="182" x2="410" y2="244" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="600" y="100" width="180" height="82" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="690.0" y="129.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Order Date</text><text x="690.0" y="147.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">when it shipped</text><text x="690.0" y="165.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">on Order</text><line x1="690" y1="182" x2="410" y2="244" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="244" width="180" height="74" rx="10" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.5"/><text x="410.0" y="277.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Date</text><text x="410.0" y="297.0" text-anchor="middle" font-size="12" font-weight="500" fill="#cfe0f0">one conformed table</text><rect x="150" y="352" width="520" height="84" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="410" y="378" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">Three relationships to the same table, not three tables.</text><text x="410" y="400" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Each one is a separate role, and a question must pick one.</text><text x="410" y="420" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Pipeline reports by Created Date; bookings by Close Date.</text><text x="410.0" y="476" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Leave the role implicit and two dashboards will quietly choose differently.</text></svg>
