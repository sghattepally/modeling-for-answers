<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Role-playing dimensions</title><desc id="d">One physical Date calendar sits beneath three role aliases - Date (Created), Date (Closed) and Date (Order). Opportunity relates once to the Created alias and once to the Closed alias; Order relates once to the Order alias. Every alias points back at the same underlying calendar, so the definitions stay conformed while each relationship stays unambiguous.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="900" height="610" fill="#ffffff"/><text x="450.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Role-playing dimensions: one calendar, three aliases</text><text x="450.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">“This quarter” is ambiguous until you say which date you mean</text><rect x="238" y="100" width="200" height="72" rx="10" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.5"/><text x="338.0" y="132.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Opportunity</text><text x="338.0" y="152.0" text-anchor="middle" font-size="12" font-weight="500" fill="#cfe0f0">FACT</text><rect x="575" y="100" width="200" height="72" rx="10" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.5"/><text x="675.0" y="132.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Order</text><text x="675.0" y="152.0" text-anchor="middle" font-size="12" font-weight="500" fill="#cfe0f0">FACT</text><line x1="338" y1="172" x2="225" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="135" y="250" width="180" height="78" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="225.0" y="285.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Date (Created)</text><text x="225.0" y="305.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">pipeline entered</text><line x1="225" y1="328" x2="450" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/><rect x="235.56535200000002" y="200.5" width="91.86929599999999" height="21" rx="4" fill="#ffffff"/><text x="281.5" y="215.32" text-anchor="middle" font-size="12" font-weight="600" fill="#1f4e79">CreatedDate</text><line x1="338" y1="172" x2="450" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="360" y="250" width="180" height="78" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="450.0" y="285.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Date (Closed)</text><text x="450.0" y="305.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">revenue booked</text><line x1="450" y1="328" x2="450" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/><rect x="354.155688" y="200.5" width="79.68862399999999" height="21" rx="4" fill="#ffffff"/><text x="394.0" y="215.32" text-anchor="middle" font-size="12" font-weight="600" fill="#1f4e79">CloseDate</text><line x1="675" y1="172" x2="675" y2="250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="585" y="250" width="180" height="78" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="675.0" y="285.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Date (Order)</text><text x="675.0" y="305.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">order shipped</text><line x1="675" y1="328" x2="450" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/><rect x="636.750776" y="200.5" width="76.498448" height="21" rx="4" fill="#ffffff"/><text x="675.0" y="215.32" text-anchor="middle" font-size="12" font-weight="600" fill="#1f4e79">OrderDate</text><rect x="320" y="400" width="260" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/><text x="450.0" y="432.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Date</text><text x="450.0" y="452.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">one physical calendar DMO</text><rect x="407.545544" y="353.5" width="84.90891199999999" height="21" rx="4" fill="#ffffff"/><text x="450" y="368.32" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">same DMO</text><rect x="80" y="500" width="740" height="68" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="450" y="524" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">One physical calendar. Three role aliases. One relationship each.</text><text x="450" y="546" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Two relationships to a single Date object would be a cycle — so it isn't allowed.</text><text x="450.0" y="590" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Leave the role implicit and two dashboards will quietly choose differently.</text></svg>
