<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Fan-out multiplies a header measure</title><desc id="d">Opportunity O-001 has an amount of one hundred thousand dollars and three line items. Traversing the one-to-many relationship repeats the header amount on every child row, so summing it returns three hundred thousand dollars instead of one hundred thousand.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="840" height="470" fill="#ffffff"/><text x="420.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Fan-out: how one-to-many multiplies your money</text><text x="420.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">One $100,000 opportunity, three line items, and a total of $300,000</text><rect x="120" y="100" width="640" height="32" rx="0" fill="#1f4e79" stroke="#94a3b8" stroke-width="1"/><text x="240.0" y="120.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Opportunity</text><text x="460.0" y="120.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Line item</text><text x="660.0" y="120.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Opportunity.Amount</text><rect x="120" y="132" width="640" height="32" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="240.0" y="152.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">O-001 Acme Platform</text><text x="460.0" y="152.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Widget</text><text x="660.0" y="152.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$100,000</text><rect x="120" y="164" width="640" height="32" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="240.0" y="184.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">O-001 Acme Platform</text><text x="460.0" y="184.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Platform License</text><text x="660.0" y="184.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$100,000</text><rect x="120" y="196" width="640" height="32" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="240.0" y="216.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">O-001 Acme Platform</text><text x="460.0" y="216.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Support Plan</text><text x="660.0" y="216.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$100,000</text><rect x="120" y="228" width="640" height="32" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="240.0" y="248.32" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">SUM</text><text x="460.0" y="248.32" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626"></text><text x="660.0" y="248.32" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">$300,000</text><rect x="120" y="274" width="300" height="74" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/><text x="270" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">The truth</text><text x="270" y="324" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">$100,000</text><rect x="440" y="274" width="320" height="74" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="600" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">What the query returns</text><text x="600" y="324" text-anchor="middle" font-size="20" font-weight="700" fill="#dc2626">$300,000</text><text x="420.0" y="384" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">The join did not add money. It copied the header amount onto every child row,</text><text x="420.0" y="408" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">and then you summed the copies. The line amounts themselves are fine:</text><text x="420.0" y="432" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">$40,000 + $35,000 + $25,000 = $100,000. Only the header amount was multiplied.</text></svg>
