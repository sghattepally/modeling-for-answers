<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">The silent no-op filter</title><desc id="d">A query referencing only fields on Opportunity never travels to Account, so a Region filter placed on Account has nothing to act on and silently does nothing. The fix is to reference an Account field or promote the filter into context.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="820" height="430" fill="#ffffff"/><text x="410.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Why the filter did nothing</text><text x="410.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">Queries are economical — they will not cross a relationship unless a field forces them to</text><rect x="210" y="92" width="400" height="56" rx="10" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/><text x="410" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Question: SUM(Amount) by Close Date</text><text x="410" y="136" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">every field lives on Opportunity</text><line x1="410" y1="148" x2="250" y2="236" stroke="#059669" stroke-width="2.5"/><line x1="410" y1="148" x2="570" y2="236" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="7 6"/><rect x="454.66176" y="185.5" width="100.67648" height="21" rx="4" fill="#ffffff"/><text x="505" y="200.32" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">not traversed</text><rect x="100" y="238" width="300" height="104" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/><text x="250" y="268" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">Opportunity</text><text x="250" y="292" text-anchor="middle" font-size="12" font-weight="500" fill="#047857">visited — Amount and Close Date</text><text x="250" y="312" text-anchor="middle" font-size="12" font-weight="400" fill="#047857">both live here, so the query</text><text x="250" y="330" text-anchor="middle" font-size="12" font-weight="400" fill="#047857">answers entirely from this object</text><rect x="420" y="238" width="300" height="104" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/><text x="570" y="268" text-anchor="middle" font-size="17" font-weight="700" fill="#64748b">Account</text><text x="570" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">Filter: Region = West</text><text x="570" y="312" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">never visited, so the filter</text><text x="570" y="330" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">has no rows to act on</text><text x="410.0" y="380" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Fix: put an Account field in the view, or promote the filter into context (Part 6),</text><text x="410.0" y="402" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">so the query is obliged to travel to Account.</text></svg>
