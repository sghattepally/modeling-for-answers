<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">The chasm trap</title><desc id="d">Opportunities and Orders both relate to a shared Account dimension. Querying both together through Account pairs every order with every opportunity for that account, inflating bookings by 2.08 times and opportunity value by 1.72 times, while silently dropping accounts that appear in only one of the two facts.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="880" height="560" fill="#ffffff"/><text x="440.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">The chasm trap: two facts, one shared dimension, no shared grain</text><text x="440.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">Acme Corp has 3 orders and 3 opportunities — the join returns 9 rows</text><rect x="60" y="106" width="220" height="74" rx="10" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.5"/><text x="170.0" y="139.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Opportunities</text><text x="170.0" y="159.0" text-anchor="middle" font-size="12" font-weight="500" fill="#cfe0f0">3 rows for Acme</text><rect x="600" y="106" width="220" height="74" rx="10" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.5"/><text x="710.0" y="139.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Orders</text><text x="710.0" y="159.0" text-anchor="middle" font-size="12" font-weight="500" fill="#cfe0f0">3 rows for Acme</text><rect x="330" y="106" width="220" height="74" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="440.0" y="139.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Account</text><text x="440.0" y="159.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">shared dimension</text><line x1="280" y1="143" x2="330" y2="143" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><line x1="600" y1="143" x2="550" y2="143" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><rect x="240" y="208" width="400" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="440" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">3 × 3 = 9 rows, a partial Cartesian product</text><rect x="70" y="276" width="740" height="32" rx="0" fill="#1f4e79" stroke="#94a3b8" stroke-width="1"/><text x="175.0" y="296.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff"></text><text x="380.0" y="296.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Alone (correct)</text><text x="580.0" y="296.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">After the join</text><text x="745.0" y="296.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Inflation</text><rect x="70" y="308" width="740" height="32" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="175.0" y="328.32" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Bookings</text><text x="380.0" y="328.32" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">$600,000</text><text x="580.0" y="328.32" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">$1,245,000</text><text x="745.0" y="328.32" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">2.08x</text><rect x="70" y="340" width="740" height="32" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="175.0" y="360.32" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Opportunity value</text><text x="380.0" y="360.32" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">$1,250,000</text><text x="580.0" y="360.32" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">$2,150,000</text><text x="745.0" y="360.32" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">1.72x</text><rect x="70" y="388" width="740" height="96" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="460" y="414" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">And it does not only inflate — it silently discards.</text><text x="460" y="438" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Granite Bank has orders but no opportunities, so its $55,000 vanishes.</text><text x="460" y="460" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Cyan Systems has an opportunity but no orders, so its $75,000 vanishes too.</text><text x="440.0" y="518" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Two facts can share a dimension without sharing a grain. That is the whole problem.</text></svg>
