<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Four defensible win rates from one field name</title><desc id="d">A two by two grid crossing value-weighted against count-based with a closed-only against all-opportunities denominator, yielding forty percent, thirty-two percent, fifty percent and thirty-six point four percent. All four are correct answers to different questions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="860" height="540" fill="#ffffff"/><text x="430.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">One field name, four defensible answers</text><text x="430.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">Every number below is correct. They answer different questions.</text><text x="290" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">Denominator: closed only</text><text x="570" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">Denominator: all opportunities</text><text x="95" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">By value</text><text x="95" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">By count</text><rect x="170" y="132" width="240" height="110" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/><text x="290" y="184" text-anchor="middle" font-size="34" font-weight="700" fill="#059669">40.0%</text><text x="290" y="216" text-anchor="middle" font-size="12.5" font-weight="500" fill="#475569">$400,000 / $1,000,000</text><rect x="450" y="132" width="240" height="110" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="2"/><text x="570" y="184" text-anchor="middle" font-size="34" font-weight="700" fill="#1f4e79">32.0%</text><text x="570" y="216" text-anchor="middle" font-size="12.5" font-weight="500" fill="#475569">$400,000 / $1,250,000</text><rect x="170" y="262" width="240" height="110" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="290" y="314" text-anchor="middle" font-size="34" font-weight="700" fill="#b45309">50.0%</text><text x="290" y="346" text-anchor="middle" font-size="12.5" font-weight="500" fill="#475569">4 won / 8 closed</text><rect x="450" y="262" width="240" height="110" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="570" y="314" text-anchor="middle" font-size="34" font-weight="700" fill="#dc2626">36.4%</text><text x="570" y="346" text-anchor="middle" font-size="12.5" font-weight="500" fill="#475569">4 won / 11 total</text><rect x="130" y="396" width="600" height="96" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="430" y="422" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">An 18-point spread on a metric everyone calls “win rate”.</text><text x="430" y="446" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">Publish two named metrics — Win Rate by Value and Win Rate by Count —</text><text x="430" y="468" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">and name one of them the house default.</text><text x="430.0" y="508" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Leave the choice implicit and the argument happens in the QBR instead of the model.</text></svg>
