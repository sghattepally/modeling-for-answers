<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Referential integrity and orphan fact rows</title><desc id="d">An opportunity whose account id is missing from the Account table. An inner join silently drops it and understates the total; an outer join or an explicit Unknown member keeps it visible so the data quality problem is apparent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="860" height="470" fill="#ffffff"/><text x="430.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Referential integrity: the fact row with no dimension match</text><text x="430.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">One opportunity carries an account id that is missing from the Account table</text><rect x="190" y="100" width="480" height="30" rx="0" fill="#1f4e79" stroke="#94a3b8" stroke-width="1"/><text x="305.0" y="119.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Opportunity</text><text x="485.0" y="119.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">account_id</text><text x="610.0" y="119.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Amount</text><rect x="190" y="130" width="480" height="30" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="305.0" y="149.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">O-001 Acme Platform</text><text x="485.0" y="149.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">A-001</text><text x="610.0" y="149.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$100,000</text><rect x="190" y="160" width="480" height="30" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="305.0" y="179.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">O-002 Borealis Renewal</text><text x="485.0" y="179.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">A-002</text><text x="610.0" y="179.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$75,000</text><rect x="190" y="190" width="480" height="30" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="305.0" y="209.32" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">O-099 Orphaned Deal</text><text x="485.0" y="209.32" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">(missing)</text><text x="610.0" y="209.32" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">$40,000</text><rect x="60" y="234" width="340" height="96" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="230" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Inner join to Account</text><text x="230" y="284" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">The orphan disappears.</text><text x="230" y="306" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Total reads $175,000 — and nothing</text><text x="230" y="324" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">on screen says a row went missing.</text><rect x="430" y="234" width="370" height="96" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/><text x="615" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Outer join, or an Unknown member</text><text x="615" y="284" text-anchor="middle" font-size="13" font-weight="400" fill="#047857">The orphan survives, bucketed as</text><text x="615" y="306" text-anchor="middle" font-size="13" font-weight="400" fill="#047857">“Unknown Account”. Total reads</text><text x="615" y="324" text-anchor="middle" font-size="13" font-weight="400" fill="#047857">$215,000 and the gap is visible.</text><text x="430.0" y="378" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Both totals are defensible. Only one of them tells you the data has a problem.</text><text x="430.0" y="406" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Give every conformed dimension an explicit Unknown member and route orphans to it, so a broken</text><text x="430.0" y="428" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">key shows up as a number you can see rather than revenue you cannot.</text></svg>
