<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Allocation factors on a bridge table</title><desc id="d">Three ways to split a one hundred thousand dollar opportunity across its three products: an equal split, an allocation by line amount whose factors sum to one, and an all-or-nothing attribution that triple counts the revenue.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="880" height="500" fill="#ffffff"/><text x="440.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Attribution: splitting one $100,000 deal across three products</text><text x="440.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">The bridge is where you encode the allocation factor</text><rect x="45" y="100" width="775" height="32" rx="0" fill="#1f4e79" stroke="#94a3b8" stroke-width="1"/><text x="127.5" y="120.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Product</text><text x="275.0" y="120.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Line amount</text><text x="405.0" y="120.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Equal split</text><text x="570.0" y="120.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">By line amount</text><text x="745.0" y="120.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">All-or-nothing</text><rect x="45" y="132" width="775" height="32" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="127.5" y="152.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Widget</text><text x="275.0" y="152.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$40,000</text><text x="405.0" y="152.32" text-anchor="middle" font-size="12" font-weight="400" fill="#b45309">$33,333</text><text x="570.0" y="152.32" text-anchor="middle" font-size="12" font-weight="400" fill="#065f46">$40,000  (0.40)</text><text x="745.0" y="152.32" text-anchor="middle" font-size="12" font-weight="400" fill="#dc2626">$100,000</text><rect x="45" y="164" width="775" height="32" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="127.5" y="184.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Platform License</text><text x="275.0" y="184.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$35,000</text><text x="405.0" y="184.32" text-anchor="middle" font-size="12" font-weight="400" fill="#b45309">$33,333</text><text x="570.0" y="184.32" text-anchor="middle" font-size="12" font-weight="400" fill="#065f46">$35,000  (0.35)</text><text x="745.0" y="184.32" text-anchor="middle" font-size="12" font-weight="400" fill="#dc2626">$100,000</text><rect x="45" y="196" width="775" height="32" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="127.5" y="216.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Support Plan</text><text x="275.0" y="216.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">$25,000</text><text x="405.0" y="216.32" text-anchor="middle" font-size="12" font-weight="400" fill="#b45309">$33,333</text><text x="570.0" y="216.32" text-anchor="middle" font-size="12" font-weight="400" fill="#065f46">$25,000  (0.25)</text><text x="745.0" y="216.32" text-anchor="middle" font-size="12" font-weight="400" fill="#dc2626">$100,000</text><rect x="45" y="228" width="775" height="32" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="127.5" y="248.32" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Total</text><text x="275.0" y="248.32" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">$100,000</text><text x="405.0" y="248.32" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">$100,000</text><text x="570.0" y="248.32" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">$100,000  (1.00)</text><text x="745.0" y="248.32" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">$300,000</text><rect x="45" y="282" width="180" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="135" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Equal split</text><text x="135" y="336" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">Simple, and usually wrong.</text><text x="135" y="356" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">Ignores that the products differ.</text><rect x="350" y="282" width="180" height="100" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/><text x="440" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">By line amount</text><text x="440" y="336" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">Usually right. Factors sum</text><text x="440" y="356" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">to 1.00, so revenue reconciles.</text><rect x="655" y="282" width="180" height="100" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="745" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">All-or-nothing</text><text x="745" y="336" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">Fine for “which products</text><text x="745" y="356" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569">appear”. Triple counts revenue.</text><text x="440.0" y="424" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Skipping this step is how “revenue by product” ends up larger than total revenue</text><text x="440.0" y="450" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">— a red flag any executive will catch, and a trust-killer for the whole model.</text></svg>
