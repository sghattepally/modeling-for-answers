<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Slowly changing dimensions, Type 1 versus Type 2</title><desc id="d">Acme Corp moves from West to East. Under Type 1 the region is overwritten, so prior-period reports are restated. Under Type 2 a second row is added with effective dates, so history is preserved and each fact joins to the version in effect at the time.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="860" height="520" fill="#ffffff"/><text x="430.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Slowly changing dimensions: Type 1 or Type 2?</text><text x="430.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">Acme Corp moves from the West region to the East on 1 June 2026</text><rect x="40" y="96" width="370" height="46" rx="10" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.5"/><text x="225" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Type 1 — overwrite</text><rect x="40" y="152" width="370" height="30" rx="0" fill="#1f4e79" stroke="#94a3b8" stroke-width="1"/><text x="132.5" y="171.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Account</text><text x="317.5" y="171.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Region</text><rect x="40" y="182" width="370" height="30" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="132.5" y="201.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Acme Corp</text><text x="317.5" y="201.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">East</text><text x="225" y="266" text-anchor="middle" font-size="13" font-weight="500" fill="#475569">One row. The old value is gone.</text><rect x="40" y="284" width="370" height="84" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="225" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">Last quarter's “West pipeline”</text><text x="225" y="331" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">changes retroactively. History is</text><text x="225" y="351" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">restated every time an attribute moves.</text><rect x="450" y="96" width="370" height="46" rx="10" fill="#059669" stroke="#059669" stroke-width="1.5"/><text x="635" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Type 2 — versioned</text><rect x="450" y="152" width="370" height="30" rx="0" fill="#1f4e79" stroke="#94a3b8" stroke-width="1"/><text x="496.0" y="171.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Region</text><text x="594.5" y="171.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">From</text><text x="699.5" y="171.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">To</text><text x="786.0" y="171.32" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Current</text><rect x="450" y="182" width="370" height="30" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="496.0" y="201.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">West</text><text x="594.5" y="201.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">2020-01-01</text><text x="699.5" y="201.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">2026-05-31</text><text x="786.0" y="201.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">No</text><rect x="450" y="212" width="370" height="30" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="496.0" y="231.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">East</text><text x="594.5" y="231.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">2026-06-01</text><text x="699.5" y="231.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">9999-12-31</text><text x="786.0" y="231.32" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">Yes</text><text x="635" y="266" text-anchor="middle" font-size="13" font-weight="500" fill="#475569">Two rows, with effective dates.</text><rect x="450" y="284" width="370" height="84" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/><text x="635" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Last quarter still reports West.</text><text x="635" y="331" text-anchor="middle" font-size="13" font-weight="400" fill="#047857">The fact joins to the version that was</text><text x="635" y="351" text-anchor="middle" font-size="13" font-weight="400" fill="#047857">in effect on its own close date.</text><text x="430.0" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Choose deliberately — it is a business question, not a technical one.</text><text x="430.0" y="444" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Type 1 for corrections (a misspelled name). Type 2 when the change is itself a fact you report on</text><text x="430.0" y="468" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">(territory moves, segment reclassification, owner changes).</text></svg>
