<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Star schema</title><desc id="d">The Opportunities fact in the center, connected to four dimensions - Account, User, Product and Date - arranged around it like the points of a star. A footnote states the grain: one row per opportunity.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="780" height="470" fill="#ffffff"/><text x="390.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Star schema: one fact, dimensions around it</text><text x="390.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">Simple to read, fast to query, easy for people and agents to navigate</text><line x1="390.0" y1="257.0" x2="150" y2="150" stroke="#94a3b8" stroke-width="2"/><line x1="390.0" y1="257.0" x2="630" y2="150" stroke="#94a3b8" stroke-width="2"/><line x1="390.0" y1="257.0" x2="150" y2="380" stroke="#94a3b8" stroke-width="2"/><line x1="390.0" y1="257.0" x2="630" y2="380" stroke="#94a3b8" stroke-width="2"/><rect x="300" y="218" width="180" height="78" rx="10" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.5"/><text x="390.0" y="253.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Opportunities</text><text x="390.0" y="273.0" text-anchor="middle" font-size="12" font-weight="500" fill="#cfe0f0">FACT · pipeline</text><rect x="60" y="118" width="180" height="64" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="150.0" y="146.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Account</text><text x="150.0" y="166.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">who</text><rect x="540" y="118" width="180" height="64" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="630.0" y="146.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">User</text><text x="630.0" y="166.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">owner</text><rect x="60" y="348" width="180" height="64" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="150.0" y="376.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Product</text><text x="150.0" y="396.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">what</text><rect x="540" y="348" width="180" height="64" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="630.0" y="376.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Date</text><text x="630.0" y="396.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">when</text><text x="390.0" y="442" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Grain: one row per opportunity — state it out loud, and never let a query change it.</text></svg>
