<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Additive, semi-additive and non-additive measures</title><desc id="d">Three classes of measure. Additive measures such as amount can be summed across any dimension. Semi-additive measures such as headcount and balance can be summed across accounts but not across time, where the last value should be used. Non-additive measures such as ratios must be recomputed from their numerator and denominator.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="880" height="440" fill="#ffffff"/><text x="440.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Not every measure can be summed</text><text x="440.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">Additivity decides which aggregations are even legal</text><rect x="40" y="100" width="250" height="250" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/><text x="165" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#059669">Additive</text><text x="165" y="160" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">Amount, Bookings</text><text x="165" y="200" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Sum across any dimension:</text><text x="165" y="224" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">accounts, products, time.</text><text x="165" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">SUM is always safe.</text><text x="165" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#059669">SUM</text><text x="165" y="322" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">over everything</text><rect x="315" y="100" width="250" height="250" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="440" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">Semi-additive</text><text x="440" y="160" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">Headcount, Balance</text><text x="440" y="200" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Sum across accounts, but</text><text x="440" y="224" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">never across time. Use the</text><text x="440" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">last value in the period.</text><text x="440" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">LAST</text><text x="440" y="322" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">over time</text><rect x="590" y="100" width="250" height="250" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="715" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">Non-additive</text><text x="715" y="160" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">Win Rate, Margin %</text><text x="715" y="200" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Never sum, never average</text><text x="715" y="224" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">the ratios. Recompute from</text><text x="715" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">the parts.</text><text x="715" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">RECOMPUTE</text><text x="715" y="322" text-anchor="middle" font-size="11.5" font-weight="400" fill="#64748b">from numerator and denominator</text><text x="440.0" y="386" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Summing a semi-additive measure across months is the classic way to report four times your real headcount.</text><text x="440.0" y="412" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">In Tableau Next, a ratio expression needs the UserAgg aggregation type so the engine does not re-aggregate it.</text></svg>
