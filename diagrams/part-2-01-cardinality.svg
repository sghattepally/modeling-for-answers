<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Star schema with cardinality declared</title><desc id="d">The same star schema with every relationship labeled many-to-one: many Opportunities relate to one Account, one User, one Product and one Date.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="800" height="490" fill="#ffffff"/><text x="400.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Declare cardinality on every relationship</text><text x="400.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">Many-to-one is the safe case: many facts roll up to one dimension member</text><line x1="400.0" y1="265.0" x2="150" y2="154" stroke="#94a3b8" stroke-width="2"/><line x1="400.0" y1="265.0" x2="650" y2="154" stroke="#94a3b8" stroke-width="2"/><line x1="400.0" y1="265.0" x2="150" y2="384" stroke="#94a3b8" stroke-width="2"/><line x1="400.0" y1="265.0" x2="650" y2="384" stroke="#94a3b8" stroke-width="2"/><rect x="237.620824" y="199.0" width="74.758352" height="21" rx="4" fill="#ffffff"/><text x="275.0" y="213.82" text-anchor="middle" font-size="12" font-weight="600" fill="#1f4e79">many → 1</text><rect x="487.62082399999997" y="199.0" width="74.758352" height="21" rx="4" fill="#ffffff"/><text x="525.0" y="213.82" text-anchor="middle" font-size="12" font-weight="600" fill="#1f4e79">many → 1</text><rect x="237.620824" y="314.0" width="74.758352" height="21" rx="4" fill="#ffffff"/><text x="275.0" y="328.82" text-anchor="middle" font-size="12" font-weight="600" fill="#1f4e79">many → 1</text><rect x="487.62082399999997" y="314.0" width="74.758352" height="21" rx="4" fill="#ffffff"/><text x="525.0" y="328.82" text-anchor="middle" font-size="12" font-weight="600" fill="#1f4e79">many → 1</text><rect x="310" y="226" width="180" height="78" rx="10" fill="#1f4e79" stroke="#1f4e79" stroke-width="1.5"/><text x="400.0" y="261.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Opportunities</text><text x="400.0" y="281.0" text-anchor="middle" font-size="12" font-weight="500" fill="#cfe0f0">the “many” side</text><rect x="60" y="122" width="180" height="64" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="150.0" y="150.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Account</text><text x="150.0" y="170.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">the “one” side</text><rect x="560" y="122" width="180" height="64" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="650.0" y="150.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">User</text><text x="650.0" y="170.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">the “one” side</text><rect x="60" y="352" width="180" height="64" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="150.0" y="380.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Product</text><text x="150.0" y="400.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">the “one” side</text><rect x="560" y="352" width="180" height="64" rx="10" fill="#e8eef5" stroke="#1f4e79" stroke-width="1.5"/><text x="650.0" y="380.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Date</text><text x="650.0" y="400.0" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">the “one” side</text><text x="400.0" y="452" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Wrong cardinality produces numbers that look plausible and are wrong — the most dangerous kind.</text></svg>
