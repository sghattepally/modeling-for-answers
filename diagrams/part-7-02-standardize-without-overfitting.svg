<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Standardization versus overfitting</title><desc id="d">Three panels showing the same year-to-date question handled three ways: under-specified so the agent guesses between a six hundred thousand dollar calendar answer and a four hundred and eighty thousand dollar fiscal answer; standardized with a default plus a named sibling and parameterized fiscal calendars; and overfitted so only one hardcoded definition can be expressed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs><rect width="860" height="470" fill="#ffffff"/><text x="430.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Standardize without overfitting</text><text x="430.0" y="62" text-anchor="middle" font-size="14" font-weight="400" fill="#475569">Standardization removes ambiguity. Overfitting removes flexibility.</text><rect x="30" y="100" width="260" height="250" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="160" y="132" text-anchor="middle" font-size="15.5" font-weight="700" fill="#dc2626">Under-specified</text><text x="160" y="168" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">“How are we doing YTD?”</text><text x="160" y="194" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">The agent guesses.</text><text x="160" y="220" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Calendar says $600,000.</text><text x="160" y="246" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Fiscal says $480,000.</text><text x="160" y="272" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Wrong for half the org.</text><rect x="300" y="100" width="260" height="250" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="2"/><text x="430" y="132" text-anchor="middle" font-size="15.5" font-weight="700" fill="#059669">Standardized</text><text x="430" y="168" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Default: Fiscal YTD.</text><text x="430" y="194" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Named sibling: Calendar YTD.</text><text x="430" y="220" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Fiscal calendar parameterized</text><text x="430" y="246" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">per business unit.</text><text x="430" y="272" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Synonyms cover the phrasings.</text><rect x="570" y="100" width="260" height="250" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="700" y="132" text-anchor="middle" font-size="15.5" font-weight="700" fill="#b45309">Overfitted</text><text x="700" y="168" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Only fiscal YTD exists.</text><text x="700" y="194" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">One hardcoded fiscal calendar.</text><text x="700" y="220" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">“Since January” falls through.</text><text x="700" y="246" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">The board's calendar-year</text><text x="700" y="272" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">question cannot be asked.</text><text x="430" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">The $120,000 gap between the two answers is one January order.</text><text x="430.0" y="416" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">Set a sensible default, keep the alternative as a named first-class metric, and parameterize</text><text x="430.0" y="440" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">where the organization genuinely varies. Take all of the standardization and none of the brittleness.</text></svg>
